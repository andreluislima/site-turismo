<nav class="navbar navbar-expand-md fixed-top">
  <a class="navbar-brand" href="#">
    <img class="logo" src="assets/img/logo2.svg" alt="Logo" />
  </a>

  <app-toggle 
    class="mx-4" 
    [isOpen]="isMenuOpen" 
    (toggle)="toggleMenu()"
    >
  </app-toggle>

  <div class="collapse navbar-collapse" [class.show]="isMenuOpen" id="navbarCollapse">
    <ul class="navbar-nav ms-auto mb-md-0 mx-5">
      <li class="nav-item" *ngFor="let page of navPages" (click)="closeMenu()">
        <img [src]="page.img" alt="" />
        <a class="nav-link active" aria-current="page" href="#">{{ page.item }}</a>
      </li>
    </ul>
  </div>
</nav>
