<div class="card custom-card" (click)="onOpen()">
  <div class="img-wrapper">
    <img [src]="item.imgBanner" class="card-img-top" alt="..." />
    <div class="title-overlay mx-3">{{item.titulo}}</div>
  </div>
  
  <div class="card-body">
    <div class="title-cidade">
      <img [src]="item.imgIcon" alt="" />
      <span>{{item.uf}}</span>
      <p class="card-text mt-2 mx-2">
        {{item.descricao}}
      </p>
    </div>
    <hr />

    <div class="row box-preco">
      <div class="col-8 col-btn p-1">
        <img src="assets/img/icons/icons8-whatsapp.png" class="mx-2" alt="" />
        <button class="btn mx-1">Falar com consultor</button>
      </div>
      <div class="col-3 col-preco mx-2">
        <span class="texto">A partir de:</span>
        <span class="preco">{{item.preco}}</span>
      </div>
    </div>
  </div>
</div>
