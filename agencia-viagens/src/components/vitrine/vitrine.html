<div class="album py-5 bg-body-tertiary">
  <div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
      <div
        class="col-12 col-md-6 col-lg-4 col-xl-3 d-flex justify-content-center box-card"
        *ngFor="let item of items; trackBy: trackById"
      >
        <app-card
          [item]="item"
          (open)="abrir(item)"
        ></app-card>
      </div>
    </div>
  </div>
</div>
