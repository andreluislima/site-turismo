<div class="carrossel">

  <div class="mb-2 p-1">
      <h2>{{title}}</h2>
  </div>

  <p-carousel
    #carousel
    [value]="slides"
    [numVisible]="4"
    [numScroll]="1"
    [circular]="true"
    [autoplayInterval]="4000"
    [responsiveOptions]="responsiveOptions"
  >
  <ng-template pTemplate="item" let-slide>
    <div class="box-img">
      <img
        [src]="slide.img"
        alt="Banner"
      />
    </div>
  </ng-template>
</p-carousel>

</div>
